version: 2
updates:
  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain Python dependencies managed by Astral uv (pyproject.toml and uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    # The limits asyncio benchmark requires coredis 4.x (see context/lessons.md).
    # Keep compatible updates, but do not propose widening its explicit upper bound.
    ignore:
      - dependency-name: "coredis"
        versions: [">=5"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
