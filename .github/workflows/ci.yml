name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UNILIMIT_REQUIRE_REDIS: "1" # a missing Redis binary fails the build instead of skipping tests

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Redis (distribution package)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq redis-server
          redis-server --version
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  redis-versions:
    name: redis (${{ matrix.server.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - { name: redis-6.2.17, url: "https://download.redis.io/releases/redis-6.2.17.tar.gz", bin: redis-server }
          - { name: redis-7.2.7, url: "https://download.redis.io/releases/redis-7.2.7.tar.gz", bin: redis-server }
          - { name: redis-stable, url: "https://download.redis.io/redis-stable.tar.gz", bin: redis-server }
          - { name: valkey-8.0.2, url: "https://github.com/valkey-io/valkey/archive/refs/tags/8.0.2.tar.gz", bin: valkey-server }
    steps:
      - uses: actions/checkout@v4
      - name: Cache server build
        if: matrix.server.name != 'redis-stable'
        uses: actions/cache@v4
        with:
          path: ~/servers/${{ matrix.server.name }}
          key: server-${{ runner.os }}-${{ matrix.server.name }}
      - name: Build ${{ matrix.server.name }}
        run: |
          dir=~/servers/${{ matrix.server.name }}
          if [ ! -x "$dir/src/${{ matrix.server.bin }}" ]; then
            mkdir -p "$dir"
            curl -fsSL "${{ matrix.server.url }}" | tar xz -C "$dir" --strip-components 1
            # Build only the server and CLI: Redis 8+ bundles modules needing extra toolchains.
            make -C "$dir/src" -j"$(nproc)" BUILD_TLS=no > /dev/null
          fi
          "$dir/src/${{ matrix.server.bin }}" --version
          echo "UNILIMIT_REDIS_SERVER=$dir/src/${{ matrix.server.bin }}" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest tests/redis_backend tests/conformance tests/concurrency -ra

  fastapi-versions:
    name: fastapi ${{ matrix.versions.fastapi }} / starlette ${{ matrix.versions.starlette }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions:
          - { fastapi: "0.115.0", starlette: "0.38.6" }
          - { fastapi: "0.120.0", starlette: "0.48.0" }
          - { fastapi: "0.140.0", starlette: "0.46.0" }
          - { fastapi: "0.140.0", starlette: "1.10.0" }
          - { fastapi: "0.162.0", starlette: "1.10.0" }
    steps:
      - uses: actions/checkout@v4
      - name: Install Redis (distribution package)
        run: sudo apt-get update -q && sudo apt-get install -yq redis-server
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Run the FastAPI suite against pinned versions
        run: |
          pins="--with fastapi==${{ matrix.versions.fastapi }} --with starlette==${{ matrix.versions.starlette }}"
          uv run $pins python -c "import fastapi, starlette; print(fastapi.__version__, starlette.__version__)"
          uv run $pins pytest tests/fastapi_integration tests/unit/test_http.py -ra

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv build
      - name: Core wheel works without any optional dependency
        run: |
          uv venv /tmp/core-env
          uv pip install --python /tmp/core-env/bin/python dist/*.whl
          /tmp/core-env/bin/python -c "
          from unilimit import Limiter, Rule
          lim = Limiter.from_url('memory://', rules=[Rule('api', '2/minute')])
          assert [lim.consume('api', 'u').allowed for _ in range(3)] == [True, True, False]
          try:
              import unilimit.backends.redis
          except ImportError as exc:
              assert 'unilimit[redis]' in str(exc)
          else:
              raise SystemExit('redis backend imported without redis-py installed')
          "
      - name: FastAPI extra installs and serves a limited app
        run: |
          uv venv /tmp/fastapi-env
          uv pip install --python /tmp/fastapi-env/bin/python "$(ls dist/*.whl)[fastapi]" httpx
          /tmp/fastapi-env/bin/python -c "
          import asyncio, httpx
          from fastapi import Depends, FastAPI
          from unilimit import Limiter
          from unilimit.integrations.fastapi import RateLimit, setup
          app = FastAPI(); setup(app, Limiter.from_url('memory://'))
          @app.get('/', dependencies=[Depends(RateLimit('x', rate='1/minute'))])
          async def root(): return {}
          async def main():
              async with httpx.AsyncClient(transport=httpx.ASGITransport(app=app), base_url='http://t') as c:
                  assert [(await c.get('/')).status_code for _ in range(2)] == [200, 429]
          asyncio.run(main())
          "
      - name: Redis extra installs and talks to a real server
        run: |
          sudo apt-get update -q && sudo apt-get install -yq redis-server
          uv venv /tmp/redis-env
          uv pip install --python /tmp/redis-env/bin/python "$(ls dist/*.whl)[redis]"
          /tmp/redis-env/bin/python -c "
          from unilimit import Limiter, Rule
          lim = Limiter.from_url('redis://127.0.0.1:6379/0', namespace='wheel-smoke')
          rule = Rule('api', '2/minute')
          lim.reset(rule, 'u')
          assert [lim.consume(rule, 'u').allowed for _ in range(3)] == [True, True, False]
          lim.reset(rule, 'u')
          "
