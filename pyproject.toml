[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unilimit"
dynamic = ["version"]
description = "One consistent, production-grade rate limiting core for Django, FastAPI and plain Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Arnav Angarkar" }]
keywords = ["rate limit", "ratelimit", "throttle", "redis", "django", "fastapi", "asyncio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# The core has no runtime dependencies. Extras (redis, django, fastapi, all) are
# added in the milestones that implement them.
dependencies = []

[project.urls]
Source = "https://github.com/ArnavBallinCode/unilimit"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.version]
path = "src/unilimit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unilimit"]

[tool.hatch.build.targets.sdist]
include = ["src/unilimit", "tests", "README.md", "LICENSE", "ARCHITECTURE.md", "API_DESIGN.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "ASYNC", "N", "S", "PIE", "RET", "PERF",
]
ignore = [
    "S101",   # assert is fine in tests and for type narrowing
    "RUF001", # µ and other unicode in strings/docs is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "PERF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.coverage.run]
branch = true
source = ["unilimit"]
