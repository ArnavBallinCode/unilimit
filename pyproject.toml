[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unilimit"
dynamic = ["version"]
description = "One consistent, production-grade rate limiting core for Django, FastAPI and plain Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "Arnav Angarkar" }]
keywords = ["rate limit", "ratelimit", "throttle", "redis", "django", "fastapi", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# The core has no runtime dependencies. Integrations and Redis are extras: redis,
# fastapi, django, drf, starlette, prometheus, otel, all.
dependencies = []

[project.urls]
Homepage = "https://github.com/ArnavBallinCode/unilimit"
Documentation = "https://github.com/ArnavBallinCode/unilimit/blob/main/docs/README.md"
Repository = "https://github.com/ArnavBallinCode/unilimit"
Issues = "https://github.com/ArnavBallinCode/unilimit/issues"
Changelog = "https://github.com/ArnavBallinCode/unilimit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = [
    "redis>=5.2",
]
fastapi = [
    "fastapi>=0.115",
]
starlette = [
    "starlette>=0.38",
]
django = [
    "django>=5.2",
]
drf = [
    "django>=5.2",
    "djangorestframework>=3.16",
]
prometheus = [
    "prometheus-client>=0.20",
]
otel = [
    "opentelemetry-api>=1.25",
]
all = [
    "unilimit[redis,fastapi,starlette,django,drf,prometheus,otel]",
]

[dependency-groups]
bench = [
    "coredis>=4,<5",
    "fastapi-limiter>=0.2.0",
    "limits>=5.8.0",
    "psutil>=7.2.2",
    "pyrate-limiter>=4.5.1",
    "slowapi>=0.1.10",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "redis>=5.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn>=0.30",
    "limits>=5.8.0",
    "django>=5.2",
    "djangorestframework>=3.18.3",
    "pytest-django>=4.14.0",
    "gunicorn>=26.2.0",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[tool.hatch.version]
path = "src/unilimit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unilimit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/unilimit",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "ARCHITECTURE.md",
    "API_DESIGN.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
DJANGO_SETTINGS_MODULE = "tests.django_integration.settings"
django_find_project = false
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "ASYNC", "N", "S", "PIE", "RET", "PERF",
]
ignore = [
    "S101",   # assert is fine in tests and for type narrowing
    "RUF001", # µ and other unicode in strings/docs is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["S603", "E501", "PERF401", "E402"]  # a developer tool, not library code
"tests/**" = ["S", "N802", "PERF", "B008", "RUF012", "PT018", "RUF059"]  # B008: Depends(...) defaults are idiomatic FastAPI

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.coverage.run]
branch = true
source = ["unilimit"]
